<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Catat Duit</title>
<style>
:root{--g:linear-gradient(135deg,#3b82f6,#8b5cf6);--in:#10b981;--out:#f43f5e;--tx:#1b1f3b;--mu:#7a809c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;color:var(--tx);background:radial-gradient(500px 260px at 100% 0,#e6e1ff,transparent),radial-gradient(420px 260px at 0 8%,#d8f1ff,transparent),#fff;min-height:100vh;padding-bottom:120px}
main{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 0;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:22px;margin-bottom:12px}h2{font-size:12px;color:var(--mu);font-weight:600;margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase}
.c{background:rgba(255,255,255,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;box-shadow:0 8px 28px #6d5dfc1c;border-radius:22px;padding:16px;margin-bottom:14px}
.hero{background:var(--g);color:#fff;border:0;box-shadow:0 12px 30px #6d5dfc55}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}.mu{color:var(--mu);font-size:13px}.hero .mu{color:#e9e6ff}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:0;padding:9px 14px;border-radius:99px;background:#fff;color:var(--tx);font:inherit;white-space:nowrap;box-shadow:0 2px 8px #0001}
.chip.on{background:var(--g);color:#fff}
.mini{background:#ffffff26;border-radius:16px;padding:10px 12px}
.in{color:var(--in)}.out{color:var(--out)}
input,select{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #e4e6f5;border-radius:14px;background:#fff;color:var(--tx);outline:0}
input:focus,select:focus{border-color:#8b5cf6}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-weight:600;font-size:16px;font-family:inherit;color:#fff;background:var(--g);box-shadow:0 8px 20px #6d5dfc44}
.btn.d{background:#fff;color:var(--out);box-shadow:none;border:1.5px solid #fecdd3;margin-top:10px}
.btn:disabled{opacity:.6}
.tx{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eef0fa}.tx:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;background:#eef0ff;display:grid;place-items:center;font-size:20px;flex:none}
.tx>div:nth-child(2){min-width:0;flex:1}.tx b{display:block}.tx .mu{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;border-radius:9px;background:#eceefb;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}
.donut{width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center}.donut u{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;text-decoration:none;font-size:12px;color:var(--mu);text-align:center}
.trend{display:flex;align-items:flex-end;gap:3px;height:110px}.trend i{flex:1;background:var(--g);border-radius:5px 5px 0 0;min-height:2px;transition:height .5s}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:536px;margin:auto;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff;border-radius:26px;box-shadow:0 10px 36px #6d5dfc33;padding:8px 4px;z-index:5}
nav button{border:0;background:0;font-size:11px;font-family:inherit;color:var(--mu);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;filter:grayscale(1);opacity:.7}nav button.on{color:#6d5dfc;font-weight:700}nav button.on b{filter:none;opacity:1}
nav .fab{width:62px;height:62px;border-radius:22px;margin:-30px auto 0;background:var(--g);color:#fff;font-size:34px;line-height:1;box-shadow:0 10px 24px #6d5dfc66;justify-content:center}
.ov{position:fixed;inset:0;background:#1b1f3b66;display:flex;align-items:flex-end;z-index:9;animation:fd .2s}@keyframes fd{from{opacity:0}}
.sh{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto;animation:up .3s}@keyframes up{from{transform:translateY(60px)}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef0ff;border-radius:16px;padding:4px}.seg button{border:0;background:0;padding:11px;border-radius:13px;font-weight:600;font-size:15px;font-family:inherit;color:var(--mu)}.seg .on{background:#fff;color:var(--tx);box-shadow:0 2px 8px #0002}
.amt{font-size:28px;font-weight:700;text-align:center}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-120px);background:#1b1f3b;color:#fff;padding:12px 18px;border-radius:16px;z-index:20;transition:.3s;max-width:90%;text-align:center}#toast.s{transform:translate(-50%,0)}
.sk{height:90px;border-radius:22px;margin-bottom:14px;background:linear-gradient(90deg,#eef0ff,#f8f9ff,#eef0ff);background-size:200%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200%}}
.emp{text-align:center;padding:22px 10px;color:var(--mu)}.emp b{font-size:38px;display:block}
.stk{position:relative;height:200px;margin:30px 0 40px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.sc{position:absolute;inset:0;border-radius:26px;padding:18px;color:#fff;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.2,.9,.25,1.1),opacity .4s;box-shadow:0 14px 30px #6d5dfc33;overflow:hidden}
.sc.d{transition:none}.sc h2{color:#ffffffd9}.sc .mu{color:#ffffffd0}
.dots{position:absolute;left:4px;bottom:-26px;display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:9px;background:#cfd3ee;transition:.3s}.dots i.on{width:22px;background:#6d5dfc}
.stk small{position:absolute;right:4px;bottom:-28px;font-size:12px;color:var(--mu)}

:root{--g:linear-gradient(135deg,#14b8a6,#6366f1);--tx:#1c1b33;--mu:#7d7a92}
body{background:radial-gradient(520px 280px at 100% 0,#ffe6d3,transparent),radial-gradient(460px 280px at 0 12%,#d9f6ef,transparent),#fbf8f3}
.c{background:rgba(255,255,255,.8);border-radius:28px}
.hero{background:radial-gradient(260px 160px at 90% 0,#14b8a655,transparent),linear-gradient(150deg,#14173a,#2a2a78 65%,#3b2a8c);box-shadow:0 16px 36px #2a2a7866}
.hero .big{font-size:36px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.g3 .mini{padding:9px 10px;font-size:12px;overflow:hidden}.g3 b{font-size:12.5px}
.nudge{background:#fff1e4;border-color:#ffd9bd;color:#b45309;font-weight:600}
nav .fab{background:linear-gradient(135deg,#ff9a56,#ff4d6d);box-shadow:0 10px 24px #ff4d6d66}
nav button.on{color:#0d9488}.dots i.on{background:#14b8a6}
.pg>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.pg>:nth-child(2){animation-delay:.05s}.pg>:nth-child(3){animation-delay:.1s}.pg>:nth-child(4){animation-delay:.15s}.pg>:nth-child(5){animation-delay:.2s}.pg>:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.pill{background:#ffffff26;border-radius:99px;padding:5px 11px;font-size:11px;font-weight:700;letter-spacing:.06em}
</style></head><body><main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>new Date(s+'T00:00'),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const IC={'Makanan & Minuman':'🍜',Transportasi:'🛵',Tagihan:'💡',Belanja:'🛍️',Hiburan:'🎬',Kesehatan:'💊',Tabungan:'🐖',Lainnya:'✨',Gaji:'💼',Freelance:'💻',Bonus:'🎁',Investasi:'📈',Hadiah:'🎀'},ic=c=>IC[c]||'🏷️';
const COL=['#3b82f6','#8b5cf6','#06b6d4','#f43f5e','#f59e0b','#10b981','#ec4899','#64748b'];
const LOGO=n=>`<svg width="${n}" height="${n}" viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(#lg)"/><path d="M66 33a24 24 0 1 0 0 34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="72" cy="50" r="7" fill="#ff7a59"/></svg>`;
let cfg=JSON.parse(localStorage.cfg||'null'),F={},S={tx:[],cats:{masuk:[],keluar:[]},meth:[],tab:'home',per:'bulan',from:'',to:'',q:'',cat:'',d:'',load:0,nab:+(localStorage.nab||20)};
function ingest(j){S.tx=j.tx||[];S.cats=j.cats||S.cats;S.meth=j.methods||[]}
try{ingest(JSON.parse(localStorage.cache||'{}'))}catch{}
function toast(m,ok=1){const t=$('#toast');t.textContent=(ok?'✅ ':'⚠️ ')+m;t.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)}
async function api(b){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,key:cfg.key})});const j=await r.json();if(!j.ok)throw new Error(j.error);return j}
async function load(){S.load=1;draw();try{const j=await api({action:'list'});ingest(j);localStorage.cache=JSON.stringify(j)}catch(e){toast('Gagal memuat: '+e.message,0)}S.load=0;draw()}
function rng(){const t=new Date(),d=iso(t);let a=d,b=d;if(S.per==='minggu'){const x=new Date(t);x.setDate(t.getDate()-(t.getDay()+6)%7);a=iso(x)}else if(S.per==='bulan')a=iso(new Date(t.getFullYear(),t.getMonth(),1));else if(S.per==='custom'){a=S.from||d;b=S.to||d;if(a>b)[a,b]=[b,a]}
const n=Math.round((pd(b)-pd(a))/864e5)+1,e=pd(a);e.setDate(e.getDate()-1);const s=new Date(e);s.setDate(e.getDate()-n+1);return{a,b,n,pa:iso(s),pb:iso(e)}}
const pick=(ty,a,b)=>S.tx.filter(x=>x.type===ty&&x.date>=a&&x.date<=b),tot=l=>l.reduce((s,x)=>s+x.amount,0);
function bycat(l){const m={};l.forEach(x=>m[x.category]=(m[x.category]||0)+x.amount);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const EMP='<div class="emp"><b>🫧</b>Belum ada transaksi di periode ini.<br>Tekan + untuk mencatat.</div>';
const chips=()=>`<div class="chips">${[['hari','Hari ini'],['minggu','Minggu ini'],['bulan','Bulan ini'],['custom','Custom']].map(([k,l])=>`<button class="chip ${S.per===k?'on':''}" onclick="S.per='${k}';draw()">${l}</button>`).join('')}</div>${S.per==='custom'?`<div class="g2" style="margin-bottom:12px"><input type="date" value="${S.from}" onchange="S.from=this.value;draw()"><input type="date" value="${S.to}" onchange="S.to=this.value;draw()"></div>`:''}`;
function home(){const r=rng(),mi=pick('masuk',r.a,r.b),ke=pick('keluar',r.a,r.b),M=tot(mi),K=tot(ke),pk=tot(pick('keluar',r.pa,r.pb)),top=bycat(ke)[0],chg=pk?(K-pk)/pk*100:null;
const t=new Date(),ms=iso(new Date(t.getFullYear(),t.getMonth(),1)),me=iso(t),Mm=tot(pick('masuk',ms,me)),kb=pick('keluar',ms,me),Km=tot(kb),left=new Date(t.getFullYear(),t.getMonth()+1,0).getDate()-t.getDate()+1,aman=Math.max(0,Mm-Km)/left;
const tg=Mm*S.nab/100,sv=tot(kb.filter(x=>x.category==='Tabungan')),pr=tg?Math.min(100,sv/tg*100):0;
const ac={};S.tx.forEach(x=>{const k=x.method||'Tanpa akun';ac[k]=(ac[k]||0)+(x.type==='masuk'?x.amount:-x.amount)});
const td=iso(t),nt=!S.tx.some(x=>x.date===td),dim=left+t.getDate()-1,pj=Km/t.getDate()*dim,sg=new Set(),so=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.row-a.row);S.qk=so.filter(x=>{const k=[x.type,x.category,x.note,x.method,x.amount].join('|');return sg.has(k)?0:sg.add(k)}).slice(0,4);const bc=bycat(ke);let g=0;const dc=bc.map(([,v],i)=>{const s0=g;g+=v/K*100;return `${COL[i%8]} ${s0}% ${g}%`}).join(',');
return `<div class="row sp" style="margin-bottom:12px"><div class="row">${LOGO(38)}<b style="font-size:19px">Catat Duit</b></div><span class="mu">● Tersinkron</span></div><div class="chips"><button class="chip" onclick="sheet('masuk')">↙ Pemasukan</button><button class="chip" onclick="S.tab='bud';draw()">🎯 Anggaran</button><button class="chip" onclick="S.tab='aud';draw()">🧮 Audit kas</button><button class="chip" onclick="S.tab='chart';draw()">📊 Grafik</button></div>${chips()}<div class="c hero"><div class="row sp"><span class="pill">PENGELUARAN</span><span class="mu">${t.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</span></div><div class="mu" style="margin-top:10px">Total pengeluaran periode ini</div><div class="big">${rp(K)}</div><div class="g3"><div class="mini"><div class="mu">Pemasukan</div><b>${rp(M)}</b></div><div class="mini"><div class="mu">Saldo</div><b>${rp(M-K)}</b></div><div class="mini"><div class="mu">Rata²/hari</div><b>${rp(K/r.n)}</b></div></div></div>
${nt?`<div class="c nudge" onclick="sheet('keluar')">📝 Belum ada catatan hari ini. Ketuk untuk mencatat sekarang.</div>`:''}
${S.qk.length?`<div class="chips">${S.qk.map((x,i)=>`<button class="chip" onclick="qk(${i})">⚡ ${esc(x.note||x.category)} · ${rp(x.amount)}</button>`).join('')}</div>`:''}
<div class="c"><h2>Prediksi akhir bulan</h2>${Km?`<div class="big" style="font-size:24px">${rp(pj)}</div><div class="mu">${pj>Mm?'⚠️ Berpotensi melebihi pemasukan bulan ini sebesar '+rp(pj-Mm):'✅ Masih aman, perkiraan sisa '+rp(Mm-pj)}</div>`:'<div class="mu">Muncul setelah ada pengeluaran bulan ini.</div>'}</div>
<div class="c"><h2>Insight</h2>${M||K?`<p>🔥 Terbesar: <b>${top?esc(top[0])+' · '+rp(top[1]):'—'}</b></p><p>📅 Rata-rata keluar/hari: <b>${rp(K/r.n)}</b></p><p>${chg==null?'🆕 Belum ada pembanding periode sebelumnya':`${chg>0?'📈':'📉'} Pengeluaran <b class="${chg>0?'out':'in'}">${chg>0?'naik':'turun'} ${Math.abs(chg).toFixed(0)}%</b> dibanding periode sebelumnya (${rp(pk)})`}</p>`:EMP}</div>
<div class="stk" id="stk">
<div class="sc" style="background:linear-gradient(135deg,#14b8a6,#6366f1)"><h2>Batas aman harian</h2><div class="big">${rp(aman)}</div><div class="mu">Sisa pemasukan − pengeluaran bulan ini, dibagi ${left} hari tersisa.</div></div>
<div class="sc" style="background:linear-gradient(135deg,#ff9a56,#ff4d6d)"><h2>Target nabung ${S.nab}%</h2><div class="row sp"><b>${rp(sv)}</b><span class="mu">dari ${rp(tg)}</span></div><div class="bar" style="margin:10px 0;background:#ffffff40"><i style="width:${pr}%;background:#fff"></i></div><div class="mu">Otomatis dari kategori "Tabungan" bulan ini.</div></div>
<div class="sc" style="background:linear-gradient(135deg,#8b5cf6,#d946ef)"><h2>Arus per akun</h2>${Object.entries(ac).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`<div class="row sp" style="padding:4px 0"><span>${esc(k)}</span><b>${rp(v)}</b></div>`).join('')||'<div class="mu">Belum ada data.</div>'}</div>
<div class="dots"><i></i><i></i><i></i></div><small>geser atau ketuk</small></div><div class="c"><h2>Ke mana perginya?</h2>${K?`<div class="row"><div class="donut" style="background:conic-gradient(${dc})"><u>Total<br><b style="color:var(--tx)">${rp(K)}</b></u></div><div style="flex:1;min-width:0">${bc.slice(0,5).map(([k,v],i)=>`<div class="row sp" style="font-size:13px;padding:3px 0"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${COL[i%8]}"></i> ${esc(k)}</span><b>${Math.round(v/K*100)}%</b></div>`).join('')}</div></div>`:'<div class="mu">Belum ada pengeluaran.</div>'}</div><div class="c"><h2>Transaksi terbaru</h2>${so.slice(0,5).map(x=>`<div class="tx" onclick="sheet('${x.type}',${S.tx.indexOf(x)})"><div class="ic">${ic(x.category)}</div><div><b>${esc(x.note||x.category)}</b><span class="mu">${esc(x.category)} · ${x.date.split('-').reverse().join('/')}</span></div><b class="${x.type==='masuk'?'in':'out'}">${x.type==='masuk'?'+':'−'}${rp(x.amount)}</b></div>`).join('')||EMP}</div>`}
function chart(){const r=rng(),ke=pick('keluar',r.a,r.b),K=tot(ke),M=tot(pick('masuk',r.a,r.b)),bc=bycat(ke);let g=0;const cs=bc.map(([,v],i)=>{const s=g;g+=v/K*100;return `${COL[i%8]} ${s}% ${g}%`}).join(',');
const m={};ke.forEach(x=>{const k=r.n>31?x.date.slice(0,7):x.date;m[k]=(m[k]||0)+x.amount});const ks=Object.keys(m).sort(),mx=Math.max(...ks.map(k=>m[k]),1),mb=Math.max(M,K,1);
return chips()+(M||K?`<div class="c"><h2>Pengeluaran per kategori</h2>${K?`<div class="row"><div class="donut" style="background:conic-gradient(${cs})"><u>Total<br><b style="color:var(--tx)">${rp(K)}</b></u></div><div style="flex:1;min-width:0">${bc.slice(0,6).map(([k,v],i)=>`<div class="row sp" style="font-size:13px;padding:3px 0"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${COL[i%8]}"></i> ${esc(k)}</span><b>${Math.round(v/K*100)}%</b></div>`).join('')}</div></div>`:'<div class="mu">Tidak ada pengeluaran.</div>'}</div>
<div class="c"><h2>Tren ${r.n>31?'bulanan':'harian'} pengeluaran</h2><div class="trend">${ks.map(k=>`<i title="${k}" style="height:${m[k]/mx*100}%"></i>`).join('')||'<span class="mu">Belum ada data.</span>'}</div></div>
<div class="c"><h2>Pemasukan vs pengeluaran</h2><div class="row sp"><span>Pemasukan</span><b class="in">${rp(M)}</b></div><div class="bar" style="margin:4px 0 12px"><i style="width:${M/mb*100}%;background:var(--in)"></i></div><div class="row sp"><span>Pengeluaran</span><b class="out">${rp(K)}</b></div><div class="bar" style="margin-top:4px"><i style="width:${K/mb*100}%;background:var(--out)"></i></div></div>`:`<div class="c">${EMP}</div>`)}
function rows(){const q=S.q.toLowerCase(),l=S.tx.filter(x=>(!S.cat||x.category===S.cat)&&(!S.d||x.date===S.d)&&(!q||(x.note+' '+x.category).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.row-a.row).slice(0,150);
return l.length?l.map(x=>`<div class="tx" onclick="sheet('${x.type}',${S.tx.indexOf(x)})"><div class="ic">${ic(x.category)}</div><div><b>${esc(x.note||x.category)}</b><span class="mu">${esc(x.category)} · ${x.date.split('-').reverse().join('/')}${x.method?' · '+esc(x.method):''}</span></div><b class="${x.type==='masuk'?'in':'out'}">${x.type==='masuk'?'+':'−'}${rp(x.amount)}</b></div>`).join(''):'<div class="emp"><b>🔎</b>Tidak ada transaksi yang cocok.</div>'}
const list=()=>$('#list').innerHTML=rows();
function hist(){const cs=[...new Set([...S.cats.masuk,...S.cats.keluar,...S.tx.map(x=>x.category)])];return `<h1>Transaksi</h1><input placeholder="🔍 Cari catatan atau kategori" value="${esc(S.q)}" oninput="S.q=this.value;list()"><div class="g2" style="margin:10px 0"><select onchange="S.cat=this.value;list()"><option value="">Semua kategori</option>${cs.map(c=>`<option ${S.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><input type="date" value="${S.d}" onchange="S.d=this.value;list()"></div><div class="c" id="list">${rows()}</div>`}
function set(){return `<h1>Setelan</h1><div class="c"><label>Target nabung (% dari pemasukan bulan ini)</label><input type="number" min="0" max="100" value="${S.nab}" onchange="S.nab=Math.min(100,Math.max(0,+this.value||0));localStorage.nab=S.nab;toast('Target nabung disimpan')"><label>URL Apps Script</label><input id="u" value="${esc(cfg.url)}"><label>Kunci rahasia</label><input id="k" type="password" value="${esc(cfg.key)}"><button class="btn" style="margin-top:14px" onclick="conn()">Simpan & muat ulang</button></div>`}
function conn(){const u=$('#u').value.trim(),k=$('#k').value.trim();if(!/^https:\/\/script\.google\.com\//.test(u)||!k)return toast('Isi URL Apps Script dan kunci dengan benar',0);cfg={url:u,key:k};localStorage.cfg=JSON.stringify(cfg);load()}
function draw(){const a=$('#app');let n=$('nav');if(!cfg){a.innerHTML=`<div style="margin:40px 0 10px">${LOGO(64)}</div><h1>Catat Duit</h1><p class="mu" style="margin-bottom:16px">Sambungkan ke spreadsheet-mu (sekali saja).</p><div class="c"><label>URL Apps Script (berakhiran /exec)</label><input id="u"><label>Kunci rahasia</label><input id="k" type="password"><button class="btn" style="margin-top:14px" onclick="conn()">Sambungkan</button></div>`;n&&n.remove();return}
a.innerHTML=S.load&&!S.tx.length?'<div class="sk"></div>'.repeat(4):({home,chart,hist,set,bud,aud})[S.tab]();bindStack();a.classList.remove("pg");a.offsetWidth;a.classList.add("pg");
if(!n){n=document.createElement('nav');document.body.append(n)}
n.innerHTML=[['home','🏠','Ringkasan'],['hist','🧾','Transaksi'],0,['bud','🎯','Anggaran'],['more','⋯','Lainnya']].map(t=>t?`<button class="${S.tab===t[0]||(t[0]=='more'&&['chart','aud','set'].includes(S.tab))?'on':''}" onclick="${t[0]=='more'?'more()':`S.tab='${t[0]}';draw();scrollTo(0,0)`}"><b>${t[1]}</b>${t[2]}</button>`:`<button class="fab" onclick="sheet('keluar')" aria-label="Tambah Transaksi">+</button>`).join('')}
function sheet(ty,i){const e=i==null?null:S.tx[i],t=new Date();F={type:ty,e,cat:e?e.category:''};const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=ev=>{if(ev.target===o)o.remove()};
o.innerHTML=`<div class="sh"><div class="row sp" style="margin-bottom:12px"><h1 style="margin:0">${e?'Edit':'Tambah'} transaksi</h1><button class="chip" onclick="$('#ov').remove()">✕</button></div>${e?'':'<div class="seg"><button data-t="keluar">Pengeluaran</button><button data-t="masuk">Pemasukan</button></div>'}<label>Nominal (Rp)</label><input id="am" class="amt" inputmode="numeric" placeholder="0" value="${e?e.amount.toLocaleString('id-ID'):''}" oninput="this.value=this.value.replace(/\\D/g,'').replace(/\\B(?=(\\d{3})+(?!\\d))/g,'.')"><label>Kategori</label><div class="chips" id="cc" style="flex-wrap:wrap"></div><div class="g2"><div><label>Tanggal</label><input id="dt" type="date" value="${e?e.date:iso(t)}"></div><div><label>Akun / metode</label><input id="mt" list="ml" value="${esc(e?e.method:'')}" placeholder="BCA, Tunai…"><datalist id="ml">${S.meth.map(m=>`<option>${esc(m)}</option>`).join('')}</datalist></div></div><label>Catatan (opsional)</label><input id="nt" value="${esc(e?e.note:'')}" placeholder="Mis. makan siang"><button class="btn" id="sv" style="margin-top:16px" onclick="save()">Simpan</button>${e?'<button class="btn d" onclick="del()">Hapus transaksi</button>':''}</div>`;
document.body.append(o);o.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{F.type=b.dataset.t;F.cat='';cc()});cc()}
const DEF={keluar:['Makanan & Minuman','Transportasi','Tagihan','Belanja','Hiburan','Kesehatan','Tabungan','Lainnya'],masuk:['Gaji','Freelance','Bonus','Investasi','Hadiah','Lainnya']};
function cc(){document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===F.type));const sc=S.cats[F.type]||[],l=[...new Set([...(sc.length?sc:DEF[F.type]),...(F.cat?[F.cat]:[])])],box=$('#cc');box.innerHTML=l.map(c=>`<button class="chip ${F.cat===c?'on':''}" data-c="${esc(c)}">${ic(c)} ${esc(c)}</button>`).join('')+'<button class="chip" data-n="1">＋ Baru</button>';box.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.n){const n=(prompt('Nama kategori baru:')||'').trim();if(n)F.cat=n}else F.cat=b.dataset.c;cc()})}
async function save(){const am=+$('#am').value.replace(/\D/g,''),tx={amount:am,category:F.cat,date:$('#dt').value,method:$('#mt').value.trim(),note:$('#nt').value.trim()};
if(!(am>0))return toast('Nominal wajib diisi dan lebih dari 0',0);if(!tx.category)return toast('Pilih kategori dulu',0);if(!tx.date)return toast('Tanggal wajib diisi',0);
const b=$('#sv'),ed=!!F.e;b.disabled=1;b.textContent='Menyimpan…';
try{await api(ed?{action:'update',type:F.type,row:F.e.row,orig:F.e,tx}:{action:'add',type:F.type,tx});$('#ov').remove();toast(ed?'Perubahan tersimpan':'Tersimpan ke spreadsheet');await load()}catch(e){toast('Gagal menyimpan: '+e.message,0);b.disabled=0;b.textContent='Simpan'}}
async function del(){if(!confirm('Hapus transaksi ini dari spreadsheet?'))return;try{await api({action:'delete',type:F.type,row:F.e.row,orig:F.e});$('#ov').remove();toast('Transaksi dihapus');await load()}catch(e){toast('Gagal menghapus: '+e.message,0)}}
S.k=0;
function lay(){const cs=[...document.querySelectorAll('.sc')];cs.forEach((c,i)=>{const o=(i-S.k+cs.length)%cs.length;c.style.zIndex=9-o;c.style.opacity=1-o*.18;c.style.transform=`translateY(${-13*o}px) scale(${1-o*.05})`});document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===S.k))}
function bindStack(){const st=$('#stk');if(!st)return;const cs=[...st.querySelectorAll('.sc')],n=cs.length;lay();let x0=null,dx=0;
const go=dir=>{const f=cs[S.k];S.k=(S.k+1)%n;lay();f.style.zIndex=20;f.style.opacity=0;f.style.transform=`translateX(${dir*130}%) rotate(${dir*18}deg)`;setTimeout(()=>{f.classList.add('d');lay();f.offsetWidth;f.classList.remove('d')},320)};
st.onpointerdown=e=>{x0=e.clientX;dx=0;cs[S.k].classList.add('d');st.setPointerCapture(e.pointerId)};
st.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;cs[S.k].style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`};
st.onpointerup=st.onpointercancel=()=>{if(x0==null)return;cs[S.k].classList.remove('d');const a=Math.abs(dx);x0=null;if(a>70||a<6)go(dx>0&&a>=6?1:-1);else lay()}}
function bud(){const t=new Date(),ms=iso(new Date(t.getFullYear(),t.getMonth(),1)),B=JSON.parse(localStorage.bud||'{}'),sp=Object.fromEntries(bycat(pick('keluar',ms,iso(t)))),cs=[...new Set([...(S.cats.keluar.length?S.cats.keluar:DEF.keluar),...Object.keys(sp)])].filter(c=>c!=='Tabungan'),TB=cs.reduce((a,c)=>a+(B[c]||0),0),TS=cs.reduce((a,c)=>a+(sp[c]||0),0);
return `<h1>Anggaran</h1><div class="c hero"><div class="mu">Sisa anggaran bulan ini</div><div class="big">${rp(TB-TS)}</div><div class="mu">Terpakai ${rp(TS)} dari ${rp(TB)}</div></div><div class="c"><h2>Ketuk kategori untuk atur batas</h2>${cs.map(c=>{const b=B[c]||0,u=sp[c]||0,p=b?Math.min(100,u/b*100):0;return `<div class="tx" onclick="setBud(this.dataset.c)" data-c="${esc(c)}"><div class="ic">${ic(c)}</div><div><b>${esc(c)}</b><div class="bar" style="margin:5px 0"><i style="width:${p}%;background:${b&&u>b?'var(--out)':p>80?'#f59e0b':''}"></i></div><span class="mu">${b?rp(u)+' / '+rp(b):'Belum diatur · '+rp(u)}</span></div></div>`}).join('')}</div><div class="mu" style="text-align:center">Batas tersimpan di HP ini.</div>`}
function setBud(c){const B=JSON.parse(localStorage.bud||'{}'),v=prompt('Batas bulanan untuk '+c+' (Rp):',B[c]||'');if(v===null)return;B[c]=+v.replace(/\D/g,'')||0;localStorage.bud=JSON.stringify(B);draw()}
function aud(){const k=JSON.parse(localStorage.kas||'null'),sd=S.tx.filter(x=>/tunai|cash/i.test(x.method)).reduce((a,x)=>a+(x.type==='masuk'?x.amount:-x.amount),0);
return `<h1>Audit kas</h1><div class="c hero"><div class="mu">Uang tunai seharusnya</div><div class="big">${rp(sd)}</div><div class="mu">Dari transaksi dengan akun "Tunai"</div>${k!=null?`<div class="g3" style="grid-template-columns:1fr 1fr"><div class="mini"><div class="mu">Uang fisik</div><b>${rp(k)}</b></div><div class="mini"><div class="mu">Selisih</div><b>${rp(k-sd)}</b></div></div>`:''}</div><div class="c"><button class="btn" onclick="cekKas()">Hitung kas fisik</button><p class="mu" style="margin-top:10px">Hitung uang tunai di dompetmu lalu masukkan jumlahnya. Selisih berarti ada transaksi tunai yang belum tercatat.</p></div>`}
function cekKas(){const v=prompt('Jumlah uang tunai di dompetmu sekarang (Rp):');if(v===null)return;localStorage.kas=JSON.stringify(+v.replace(/\D/g,'')||0);draw()}
function more(){const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=e=>{if(e.target===o)o.remove()};const m=[['chart','📊','Grafik','Kategori, tren, perbandingan'],['aud','🧮','Audit kas','Cocokkan uang tunai'],['set','⚙️','Setelan','Sambungan & target nabung']];
o.innerHTML=`<div class="sh"><div class="row sp"><div><h1 style="margin:0">Mau ke mana?</h1><div class="mu">Semua fitur tetap dekat.</div></div><button class="chip" onclick="$('#ov').remove()">✕</button></div><div class="g2" style="margin-top:14px">${m.map(x=>`<div class="c" style="margin:0" onclick="S.tab='${x[0]}';$('#ov').remove();draw();scrollTo(0,0)"><div style="font-size:24px">${x[1]}</div><b>${x[2]}</b><div class="mu">${x[3]}</div></div>`).join('')}</div></div>`;document.body.append(o)}
function qk(i){const x=S.qk[i];sheet(x.type);F.cat=x.category;cc();$('#am').value=x.amount.toLocaleString('id-ID');$('#mt').value=x.method;$('#nt').value=x.note}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');draw();if(cfg)load();
</script></body></html>
